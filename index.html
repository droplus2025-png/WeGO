<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WeGo — البيع</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1530">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0b1530;--panel:#13214a;--key:#1c2f66;--line:#24366b;--gold:#e8b830;--text:#f2f5ff;--mut:#9fb0dd;--ok:#16a34a;--warn:#f59e0b;--bad:#e11d48;--info:#2563eb;--vio:#7c3aed}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,"Segoe UI",Tahoma,sans-serif}
body{display:grid;gap:8px;padding:8px;grid-template-columns:150px 1fr 340px;grid-template-rows:56px minmax(0,1fr);grid-template-areas:"top top top" "menu main find"}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.b{border:0;border-radius:12px;min-height:46px;padding:0 12px;font:700 16px system-ui,"Segoe UI",Tahoma,sans-serif;color:#fff;background:var(--key);cursor:pointer;transition:transform .06s,filter .06s}
.b:active{transform:scale(.93);filter:brightness(1.35)}
.b:disabled{opacity:.4}
#top{grid-area:top;display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:14px;padding:0 14px;border-bottom:3px solid var(--gold)}
#logo{width:42px;height:42px;border-radius:10px;object-fit:contain}
#top b{font-size:20px;flex:1}#date{color:var(--mut)}
#menu{grid-area:menu;display:flex;flex-direction:column;gap:6px;overflow:auto}
#menu .b{flex:1;min-height:44px;text-align:right;font-size:15px}
#menu .on{outline:3px solid var(--gold)}
main{grid-area:main;display:grid;gap:8px;grid-template-rows:auto minmax(0,1fr) minmax(0,34%);min-height:0}
#cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
#cats .b{min-width:84px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;min-height:56px}
#cats .b i{font:900 22px system-ui,"Segoe UI",Tahoma,sans-serif;font-style:normal}#cats .b small{font-size:12px;opacity:.9}
#cats .sel{outline:3px solid #fff}
#calc{background:var(--panel);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:0}
#disp{display:flex;align-items:center;gap:8px;background:#071026;border-radius:12px;padding:6px 12px;min-height:66px}
#expr{flex:1;font:700 34px system-ui,"Segoe UI",Tahoma,sans-serif;text-align:left;overflow-x:auto;white-space:nowrap;color:var(--gold)}
#expr:empty::before{content:"0";color:var(--line)}
#hint{color:var(--mut);font-size:13px;min-height:18px}
#keys{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:8px;min-height:0}
#keys .b{font-size:28px;min-height:0}
.op{background:var(--info)!important}.del{background:var(--bad)!important}.at{background:var(--vio)!important}.go{background:var(--warn)!important;color:#111!important}.pay{background:var(--ok)!important}
#cart{background:var(--panel);border-radius:14px;padding:8px;display:flex;flex-direction:column;min-height:0}
#lines{flex:1;overflow-y:auto;min-height:0}
.ln{display:flex;align-items:center;gap:8px;padding:7px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.ln .n{width:22px;color:var(--mut)}.ln .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ln .t{min-width:76px;text-align:left;font-weight:700}.ln .x{min-height:34px;width:34px;padding:0;background:var(--bad)}
.gen .nm{color:var(--warn)}
#bar{display:flex;align-items:center;gap:10px;padding-top:8px}
#total{flex:1;font:900 30px system-ui,"Segoe UI",Tahoma,sans-serif;color:var(--gold);text-align:left}
#pay{min-width:150px;min-height:56px;font-size:22px}
#find{grid-area:find;background:var(--panel);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:0}
#q{background:#071026;border:2px solid var(--line);border-radius:12px;color:var(--text);font:16px system-ui,"Segoe UI",Tahoma,sans-serif;padding:10px 12px;user-select:text}
#q:focus{outline:0;border-color:#d946ef}
#res{flex:1;overflow-y:auto;min-height:0}
.r{display:flex;align-items:center;gap:8px;padding:9px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.r:active{background:var(--key)}.r .s{min-width:44px;font-weight:900;color:var(--gold)}.r .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .p{font-weight:700}.r small{color:var(--mut);font-size:12px}.r.new{color:#f0abfc;font-weight:700}.zero small.q{color:#fb7185}
dialog{background:var(--panel);color:var(--text);border:2px solid var(--gold);border-radius:16px;padding:16px;width:min(92vw,380px)}
dialog textarea{font-size:15px}dialog::backdrop{background:#000a}dialog h3{margin:0 0 10px;color:var(--gold)}
dialog label{display:block;margin:8px 0;color:var(--mut);font-size:14px}
dialog input,dialog textarea{display:block;width:100%;margin-top:4px;background:#071026;border:2px solid var(--line);border-radius:10px;color:var(--text);font:18px system-ui,"Segoe UI",Tahoma,sans-serif;padding:10px;user-select:text}
dialog .row{display:flex;gap:8px;margin-top:14px}dialog .row .b{flex:1}
#toast{position:fixed;inset:auto 0 24px 0;margin:auto;width:max-content;max-width:90vw;background:#111c3d;border:2px solid var(--gold);padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}#toast.err{border-color:var(--bad)}
#screen{position:fixed;inset:0;z-index:5;background:var(--bg);display:none;grid-template-rows:56px minmax(0,1fr);gap:8px;padding:8px}
#screen.on{display:grid}
#sh{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:14px;padding:0 10px;border-bottom:3px solid var(--gold)}
#sh b{flex:1;font-size:20px}#sact{display:flex;gap:8px}
#sbody{display:flex;gap:8px;min-height:0}
.pn{background:var(--panel);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:0;flex:1}
.pn .list{flex:1;overflow-y:auto;min-height:0}
.tb{display:grid;grid-template-columns:8% 10% 42% 14% 14% 12%;gap:4px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--line)}
.tb.h{color:var(--mut);font-size:13px}.tb [data-f]{cursor:pointer}.tb .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb .red{color:#fb7185;font-weight:700}.tb .s{color:var(--gold);font-weight:900}
.mini{display:flex;gap:6px;overflow-x:auto}.mini .b{min-height:40px;min-width:64px}
@media(max-width:900px){
 #sbody{flex-direction:column;overflow-y:auto}.pn{flex:none;min-height:300px}
 body{grid-template-columns:1fr;grid-template-rows:auto auto auto auto;grid-template-areas:"top" "menu" "main" "find";height:auto;overflow-y:auto}
 html{height:auto}#menu{flex-direction:row}#menu .b{flex:none;min-height:40px;white-space:nowrap}
 main{grid-template-rows:auto 360px 220px}#find{height:320px}#expr{font-size:28px}
}
</style>
</head>
<body>
<header id="top"><img id="logo" src="logo.png" alt="WeGo"><b id="shop">WeGo</b><span id="date" class="num"></span></header>
<nav id="menu"></nav>
<main>
  <section id="cats"></section>
  <section id="calc">
    <div id="disp"><button class="b del" id="clr" style="min-height:44px">مسح</button><div id="expr" class="num"></div></div>
    <div id="hint"></div>
    <div id="keys"></div>
  </section>
  <section id="cart">
    <div id="lines"></div>
    <div id="bar"><button class="b pay" id="pay" disabled>دفع</button><div id="total" class="num">0.00</div></div>
  </section>
</main>
<aside id="find"><input id="q" type="search" placeholder="بحث: اسم المنتج أو رقمه" autocomplete="off"><div id="res"></div></aside>
<div id="screen"></div><dialog id="dlg"></dialog><div id="toast"></div>

<script src="wego_rules.js"></script>
<script src="wego_schema.js"></script>
<script src="wego_store.js"></script>
<script src="wego_catalog.js"></script>
<script src="wego_engine.js"></script>
<script src="wego_sale.js"></script>
<script src="wego_purchase.js"></script>
<script src="wego_stock.js"></script>
<script src="wego_invoices.js"></script>
<script src="wego_debts.js"></script>
<script src="wego_cash.js"></script>
<script src="wego_admin.js"></script>
<script>
(() => {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const { normalizeText, parseSku } = WeGo.rules;
  const COLORS = { DG: '#0ea5e9', E: '#f59e0b', P: '#06b6d4', S: '#ec4899', M: '#b45309', O: '#64748b', EM: '#8b5cf6' };
  const EXTRA = ['#14b8a6', '#f97316', '#84cc16', '#ef4444'];
  const ERRORS = {
    PARTY_REQUIRED: 'الاسم والهاتف إلزاميان عند وجود دين',
    INVALID_PHONE: 'رقم الهاتف غير صحيح',
    INVALID_SKU: 'رقم المنتج غير صحيح',
    OVERPAID: 'المبلغ المدفوع أكبر من المجموع',
    INVALID_NUMBER: 'رقم غير صحيح',
    INVALID_NAME: 'الاسم مطلوب',
    UNKNOWN_CATEGORY: 'حرف الصنف غير معروف',
    INSUFFICIENT_STOCK: 'المخزون غير كاف',
  };
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
  let store, cat, eng, cats = [], cart = [], expr = '', activeCat = null, ref = uid(), beepOn = false, actx = null;

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const money = (c) => (c / 100).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  const plain = (c) => String(c / 100);
  const cents = (v) => Math.round(parseFloat(String(v).replace(',', '.')) * 100);
  const fmtQty = WeGo.sale.format.qty;
  const toUnits = WeGo.sale.toUnits;
  const rowTotal = (l) => Math.round((l.qty * l.price) / 100);
  const total = () => cart.reduce((s, l) => s + rowTotal(l), 0);
  const prefixOf = (c) => (c.prefix === '' ? '#' : c.prefix);
  const colorOf = (c, i) => COLORS[c.id] || EXTRA[i % EXTRA.length];

  let toastTimer;
  function toast(msg, bad) {
    const t = $('#toast');
    t.textContent = msg; t.className = 'show' + (bad ? ' err' : '');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.className = ''; }, 2600);
  }
  const buzz = () => {
    if (navigator.vibrate) navigator.vibrate(8);
    if (!beepOn) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.frequency.value = 880; g.gain.value = 0.05;
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + 0.04);
    } catch (_) { /* no audio available */ }
  };
  const fail = (e) => toast(ERRORS[e.code] || e.message || 'خطأ', true);

  function ask(title, fields, ok, focus, extra) {
    return new Promise((resolve) => {
      const d = $('#dlg');
      let out = null;
      d.innerHTML = '<h3>' + title + '</h3>' + fields.map((f) => '<label>' + f.l + (f.t === 'area'
        ? '<textarea name="' + f.n + '" rows="8" style="width:100%"></textarea>'
        : '<input name="' + f.n + '" value="' + esc(f.v == null ? '' : f.v) + '" inputmode="' + (f.m || 'text') + '" autocomplete="off">') + '</label>').join('') +
        '<div class="row"><button class="b pay go-ok">' + ok + '</button>' + (extra ? '<button class="b del xt">' + extra + '</button>' : '') + '<button class="b no">إلغاء</button></div>';
      d.querySelector('.go-ok').onclick = () => {
        out = Object.fromEntries([...d.querySelectorAll('input,textarea')].map((i) => [i.name, i.value.trim()]));
        d.close();
      };
      if (extra) d.querySelector('.xt').onclick = () => { out = { _extra: true }; d.close(); };
      d.querySelector('.no').onclick = () => d.close();
      d.onclose = () => resolve(out);
      d.showModal();
      if (focus) d.querySelector('input,textarea').focus();
    });
  }

  /* ---------- calculator ---------- */
  const KEYS = [['7'], ['8'], ['9'], ['⌫', 'del'], ['4'], ['5'], ['6'], ['×', 'op'], ['1'], ['2'], ['3'], ['+', 'op'], ['0'], ['.'], ['@', 'at'], ['إضافة', 'go']];

  function parseTerm(t) {
    let m = /^([A-Z]{1,3}|#)(\d+)(?:[×*](\d*\.?\d+))?(?:@(\d*\.?\d+))?$/.exec(t);
    if (m) return { sku: (m[1] === '#' ? '' : m[1]) + m[2], qty: toUnits(m[3] || '1'), price: m[4] };
    m = /^(?:(\d*\.?\d+)[×*])?(\d*\.?\d+)$/.exec(t);
    if (m) return { qty: toUnits(m[1] || '1'), price: m[2] };
    throw Object.assign(new Error('صيغة غير صحيحة: ' + t), { code: 'SYNTAX' });
  }

  function renderExpr() {
    $('#expr').textContent = expr;
    $('#hint').textContent = expr ? '' : 'مثال: 14+3×5 (سعر) • E4×2 (منتج E4 مرتين) • E4@90 (بسعر 90)';
  }

  function press(k) {
    buzz();
    if (k === '⌫') expr = expr.slice(0, -1);
    else if (k === 'إضافة') { addExpr(); return; }
    else expr += k === '+' && (expr === '' || expr.endsWith('+')) ? '' : k;
    renderExpr();
  }

  function recall(l) {
    if (l.sku) return l.sku.replace(/^(\d)/, '#$1') + (l.qty !== 100 ? '×' + fmtQty(l.qty) : '') + (l.price !== l.list ? '@' + plain(l.price) : '');
    return l.qty !== 100 ? fmtQty(l.qty) + '×' + plain(l.price) : plain(l.price);
  }

  async function addExpr() {
    if (!expr) return;
    try {
      const terms = expr.split('+').filter(Boolean).map(parseTerm);
      const added = [];
      for (const t of terms) {
        if (t.sku) {
          let p = await cat.findBySku(t.sku);
          if (!p) p = await newProduct(t.sku);
          if (!p) return;
          added.push({ product_id: p.id, sku: p.sku, name: p.name, qty: t.qty, price: t.price ? cents(t.price) : p.sell_cents, list: p.sell_cents });
        } else {
          added.push({ name: '', qty: t.qty, price: cents(t.price), list: 0 });
        }
      }
      for (const l of added) pushLine(l);
      expr = '';
      renderExpr(); renderCart();
    } catch (e) { fail(e); }
  }

  function pushLine(l) {
    const same = l.product_id && cart.find((c) => c.product_id === l.product_id && c.price === l.price);
    if (same) { same.qty += l.qty; return; }
    if (!l.product_id) l.name = 'produit ' + (cart.filter((c) => !c.product_id).length + 1);
    cart.push(l);
  }

  /* ---------- categories, search, results ---------- */
  function renderCats() {
    $('#cats').innerHTML = cats.map((c, i) =>
      '<button class="b' + (activeCat && activeCat.id === c.id ? ' sel' : '') + '" data-i="' + i + '" style="background:' + colorOf(c, i) + '"><i>' + prefixOf(c) + '</i><small>' + esc(c.name_ar) + '</small></button>').join('');
  }

  function pickCategory(c) {
    buzz();
    activeCat = c;
    if (expr !== '' && !expr.endsWith('+')) expr = /[A-Z#]$/.test(expr) ? expr.slice(0, -1) : expr + '+';
    expr += prefixOf(c);
    renderExpr(); renderCats(); $('#q').value = '';
    listCategory(c);
  }

  function rows(list, withNew) {
    const head = withNew ? '<div class="r new" data-new="1">＋ منتج جديد في هذا الصنف</div>' : '';
    $('#res').innerHTML = head + list.map((p) =>
      '<div class="r' + (p.qty <= 0 ? ' zero' : '') + '" data-id="' + p.id + '"><span class="s num">' + esc(p.sku) + '</span><span class="nm">' + esc(p.name) + '</span>' +
      '<span class="p num">' + money(p.sell_cents) + '</span><small class="num">A' + plain(p.buy_cents) + '</small><small class="q num">Q' + fmtQty(p.qty) + '</small></div>').join('') ||
      '<div class="r" style="cursor:default;color:var(--mut)">لا نتائج</div>';
  }

  async function listCategory(c) {
    rows(await cat.listByCategory(c.id), true);
  }

  async function search(q) {
    const n = normalizeText(q);
    if (!n) { if (activeCat) listCategory(activeCat); else $('#res').innerHTML = ''; return; }
    const all = await store.tx(['products'], 'readonly', (tx) => tx.all('products'));
    const hit = all.filter((p) => !p.is_deleted && (p.name_norm.includes(n) || p.sku.toLowerCase() === n));
    rows(hit.sort((a, b) => a.name_norm.indexOf(n) - b.name_norm.indexOf(n)).slice(0, 40), false);
  }

  async function newProduct(sku) {
    let c = activeCat;
    if (sku) { const pr = parseSku(sku).prefix; c = cats.find((x) => x.prefix === pr) || c; }
    if (!c) { toast('اختر صنفًا أولًا', true); return null; }
    const v = await ask('منتج جديد ' + (sku ? sku : '— ' + esc(c.name_ar)), [
      { l: 'اسم المنتج', n: 'name' }, { l: 'سعر البيع', n: 'sell', m: 'decimal' }, { l: 'سعر الشراء (اختياري)', n: 'buy', m: 'decimal' }], 'حفظ', true);
    if (!v) return null;
    try {
      const p = await cat.createProduct({ ...(sku ? { sku } : { category_id: c.id }), name: v.name, sell_cents: cents(v.sell || 0), buy_cents: cents(v.buy || 0), qty: 0 });
      toast('تمت إضافة ' + p.sku);
      if (activeCat) listCategory(activeCat);
      return p;
    } catch (e) { fail(e); return null; }
  }

  async function addProductById(id) {
    const p = await cat.getProduct(id);
    if (!p || p.is_deleted) return;
    buzz(); pushLine({ product_id: p.id, sku: p.sku, name: p.name, qty: 100, price: p.sell_cents, list: p.sell_cents });
    expr = expr.replace(/(^|\+)[A-Z#]+$/, '$1').replace(/\+$/, '');   // a lone category letter is not needed once the product is chosen
    renderCart(); renderExpr();
  }

  /* ---------- cart and payment ---------- */
  function renderCart() {
    $('#lines').innerHTML = cart.map((l, i) =>
      '<div class="ln' + (l.product_id ? '' : ' gen') + '" data-i="' + i + '"><span class="n">' + (i + 1) + '</span><span class="nm">' + esc((l.sku ? l.sku + ' · ' : '') + l.name) + '</span>' +
      '<span class="num">' + fmtQty(l.qty) + '×' + money(l.price) + '</span><span class="t num">' + money(rowTotal(l)) + '</span><button class="b x" data-x="' + i + '">✕</button></div>').join('');
    $('#total').textContent = money(total());
    $('#pay').disabled = cart.length === 0;
    const box = $('#lines'); box.scrollTop = box.scrollHeight;
  }

  async function checkout(paid, customer, allowLoss) {
    const lines = cart.map((l) => (l.product_id ? { product_id: l.product_id, qty: l.qty, unit_price_cents: l.price } : { qty: l.qty, unit_price_cents: l.price }));
    const quick = cart.some((l) => !l.product_id);
    try {
      const r = await (quick ? eng.quickSale : eng.sale).call(eng, { lines, paid_cents: paid, customer, client_ref: ref, allow_loss: allowLoss });
      cart = []; expr = ''; ref = uid();
      renderCart(); renderExpr();
      toast('✔ فاتورة ' + r.invoice.number + (r.invoice.due_cents ? ' — دين ' + money(r.invoice.due_cents) : ''));
      if (activeCat) listCategory(activeCat);
    } catch (e) {
      if (e.code === 'LOSS_NEEDS_CONFIRMATION') {
        if (confirm('السطر ' + e.details.line_nos.join(', ') + ' يُباع بأقل من سعر الشراء. هل تتابع؟')) return checkout(paid, customer, true);
        return;
      }
      fail(e);
    }
  }

  async function pay() {
    const sum = total();
    if (!sum) return;
    const v = await ask('الدفع — المجموع ' + money(sum), [
      { l: 'المبلغ المدفوع', n: 'paid', v: plain(sum), m: 'decimal' },
      { l: 'اسم الزبون (إلزامي عند الدين)', n: 'name' }, { l: 'الهاتف', n: 'phone', m: 'tel' }], 'تأكيد', false);
    if (!v) return;
    const paid = v.paid === '' ? sum : cents(v.paid);
    if (Number.isNaN(paid)) { toast('مبلغ غير صحيح', true); return; }
    await checkout(paid, { name: v.name, phone: v.phone });
  }

  async function loadSettings() {
    const rows = await store.tx(['settings'], 'readonly', (tx) => tx.all('settings'));
    const s = Object.fromEntries(rows.map((r) => [r.key, r.value]));
    beepOn = s.beep === 1;
    $('#shop').textContent = s.shop_name || 'WeGo';
    return s;
  }

  async function reloadCats() { cats = await cat.listCategories(); renderCats(); }

  /* ---------- full-screen views (purchase, stock...) ---------- */
  const SCREENS = {
    'شراء': 'purchase', 'المخزون': 'stock', 'فواتير': 'invoices', 'إرجاع': 'invoices',
    'الإدارة': 'admin', 'ديون الزبناء': 'debts_customer', 'مستحقات الموردين': 'debts_supplier', 'مصاريف': 'expenses', 'الصندوق': 'cash',
  };

  function showScreen(title) {
    const s = $('#screen');
    s.innerHTML = '<div id="sh"><button class="b" id="sback">رجوع</button><b>' + title + '</b><span id="sact"></span></div><div id="sbody"></div>';
    s.classList.add('on');
    $('#sback').onclick = () => { s.classList.remove('on'); s.innerHTML = ''; document.dispatchEvent(new Event('wego:closed')); };
    return { body: $('#sbody'), actions: $('#sact') };
  }
  document.addEventListener('wego:closed', () => { $('#q').value = ''; if (activeCat) listCategory(activeCat); });

  /* ---------- start ---------- */
  function build() {
    $('#keys').innerHTML = KEYS.map(([k, c]) => '<button class="b ' + (c || '') + '" data-k="' + k + '">' + k + '</button>').join('');
    const items = [['بيع', '#16a34a', 1], ['فواتير', '#2563eb'], ['ديون الزبناء', '#e11d48'], ['شراء', '#f59e0b'], ['مصاريف', '#a855f7'], ['مستحقات الموردين', '#0ea5e9'], ['إرجاع', '#f97316'], ['الصندوق', '#eab308'], ['المخزون', '#14b8a6'], ['الإدارة', '#64748b']];
    $('#menu').innerHTML = items.map(([n, c, on]) => '<button class="b' + (on ? ' on' : '') + '" style="background:' + c + '" data-m="' + n + '">' + n + '</button>').join('');
    $('#date').textContent = new Date().toLocaleDateString('en-GB');

    $('#keys').onclick = (e) => { const b = e.target.closest('[data-k]'); if (b) press(b.dataset.k); };
    $('#clr').onclick = () => { buzz(); expr = ''; renderExpr(); };
    $('#cats').onclick = (e) => { const b = e.target.closest('[data-i]'); if (b) pickCategory(cats[+b.dataset.i]); };
    $('#menu').onclick = (e) => {
      const b = e.target.closest('[data-m]');
      if (!b || b.classList.contains('on')) return;
      const key = SCREENS[b.dataset.m];
      if (key && WeGo.screens && WeGo.screens[key]) WeGo.screens[key].open(); else toast(b.dataset.m + ' — في مرحلة لاحقة');
    };
    $('#q').oninput = (e) => search(e.target.value);
    $('#res').onclick = (e) => {
      const r = e.target.closest('.r');
      if (!r) return;
      if (r.dataset.new) newProduct(null); else if (r.dataset.id) addProductById(r.dataset.id);
    };
    $('#lines').onclick = (e) => {
      const x = e.target.closest('[data-x]');
      if (x) { buzz(); cart.splice(+x.dataset.x, 1); renderCart(); return; }
      const ln = e.target.closest('.ln');
      if (ln) { const l = cart.splice(+ln.dataset.i, 1)[0]; expr = (expr ? expr + '+' : '') + recall(l); renderCart(); renderExpr(); }
    };
    $('#pay').onclick = () => { buzz(); pay(); };
  }

  (async () => {
    store = await new WeGo.store.IdbStore(WeGo.schema, 'wego_db').open();
    cat = await new WeGo.catalog.Catalog(store).init();
    eng = new WeGo.engine.Engine(store, cat);
    cats = await cat.listCategories();
    await loadSettings();
    build(); renderCats(); renderExpr(); renderCart();
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
    WeGo.ui = { $, ask, toast, fail, esc, money, plain, cents, buzz, showScreen, loadSettings, reloadCats, cats: () => cats, cat, eng, store };
  })().catch((e) => { document.body.textContent = 'تعذر تشغيل البرنامج: ' + e.message; });
})();
</script>
</body>
</html>
